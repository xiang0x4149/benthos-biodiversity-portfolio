<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 835" role="img" aria-label="方法适用输入与分析需求"><title>方法适用输入与分析需求</title><rect width="1100" height="835" fill="#f5f7ef"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183f42}.small{font-size:15px;fill:#5c7468}.head{font-size:21px;font-weight:bold}</style><text x="35" y="48" class="head">输入与问题决定方法，组分名称必须跟随计算定义</text><rect x="25" y="85" width="1050" height="90" rx="10" fill="white" stroke="#d3e0d0"/><text x="42" y="113" font-size="18">有无矩阵</text><text x="42" y="146" class="small">关心组成替换或子集化</text><path d="M360 127H405" stroke="#749b86" stroke-width="2"/><text x="430" y="113" font-size="18">Sørensen + Baselga</text><text x="430" y="146" class="small">周转／嵌套结果；不能套给其他分解</text><rect x="25" y="189" width="1050" height="90" rx="10" fill="white" stroke="#d3e0d0"/><text x="42" y="217" font-size="18">密度／生物量矩阵</text><text x="42" y="250" class="small">关心数量结构与优势度</text><path d="M360 231H405" stroke="#749b86" stroke-width="2"/><text x="430" y="217" font-size="18">Bray–Curtis 分解</text><text x="430" y="250" class="small">平衡数量变化／数量梯度；分别使用原单位</text><rect x="25" y="293" width="1050" height="90" rx="10" fill="white" stroke="#d3e0d0"/><text x="42" y="321" font-size="18">混合类型性状 + 群落矩阵</text><text x="42" y="354" class="small">希望保留低丰富度样本</text><path d="M360 335H405" stroke="#749b86" stroke-width="2"/><text x="430" y="321" font-size="18">加权 Gower → UPGMA 功能树</text><text x="430" y="354" class="small">替换／丰富度或数量差异；保留缺失假设</text><rect x="25" y="397" width="1050" height="90" rx="10" fill="white" stroke="#d3e0d0"/><text x="42" y="425" font-size="18">性状坐标 + 高丰富度样本</text><text x="42" y="458" class="small">研究功能空间体积</text><path d="M360 439H405" stroke="#749b86" stroke-width="2"/><text x="430" y="425" font-size="18">PCoA → 凸包敏感性分析</text><text x="430" y="458" class="small">样本类群数必须大于维数；子集会改变覆盖</text><rect x="25" y="501" width="1050" height="90" rx="10" fill="white" stroke="#d3e0d0"/><text x="42" y="529" font-size="18">分类阶元 + 群落矩阵</text><text x="42" y="562" class="small">分子序列覆盖不足</text><path d="M360 543H405" stroke="#749b86" stroke-width="2"/><text x="430" y="529" font-size="18">单位枝长分类树代理</text><text x="430" y="562" class="small">只能描述分类支系距离，不能称为分子树</text><rect x="25" y="605" width="1050" height="90" rx="10" fill="white" stroke="#d3e0d0"/><text x="42" y="633" font-size="18">同点两季的距离矩阵</text><text x="42" y="666" class="small">评估整体季节效应</text><path d="M360 647H405" stroke="#749b86" stroke-width="2"/><text x="430" y="633" font-size="18">受限 PERMANOVA + PERMDISP</text><text x="430" y="666" class="small">按固定点置换；多矩阵进行 BH 校正</text><rect x="25" y="709" width="1050" height="90" rx="10" fill="white" stroke="#d3e0d0"/><text x="42" y="737" font-size="18">单季节距离 + 环境／空间</text><text x="42" y="770" class="small">探索关联与解释分区</text><path d="M360 751H405" stroke="#749b86" stroke-width="2"/><text x="430" y="737" font-size="18">变量筛选 → dbRDA → VPA</text><text x="430" y="770" class="small">小样本探索性；空间 PCA 不等于 PCNM</text></svg>