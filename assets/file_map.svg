<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="文件层级与阅读用途"><title>文件层级与阅读用途</title><rect width="1100" height="560" fill="#f5f7ef"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183f42}.small{font-size:15px;fill:#5c7468}.head{font-size:21px;font-weight:bold}</style><text x="35" y="45" class="head">公开仓库文件地图 · 从材料、解释到可运行演示</text><path d="M45 70V485" stroke="#749b86" stroke-width="2"/><path d="M45 83H70" stroke="#749b86"/><text x="80" y="90" font-size="18">README.md / index.html</text><text x="445" y="90" class="small">项目概览、贡献归属和推荐阅读顺序</text><path d="M45 129H70" stroke="#749b86"/><text x="80" y="136" font-size="18">docs/</text><text x="445" y="136" class="small">公开校订报告、数据目录与发布说明</text><path d="M45 175H95" stroke="#749b86"/><text x="105" y="182" font-size="18">research_report.html</text><text x="445" y="182" class="small">先读研究问题与方法取舍，包含季节分析和局限</text><path d="M45 221H70" stroke="#749b86"/><text x="80" y="228" font-size="18">data/traits/</text><text x="445" y="228" class="small">真实性状编码、来源、审阅和冲突；均无样本观测</text><path d="M45 267H70" stroke="#749b86"/><text x="80" y="274" font-size="18">data/historical/</text><text x="445" y="274" class="small">历史研究的聚合统计；不含样点级结果或距离矩阵</text><path d="M45 313H70" stroke="#749b86"/><text x="80" y="320" font-size="18">data/synthetic/</text><text x="445" y="320" class="small">从零生成的示例观测、合并映射和配对元数据</text><path d="M45 359H70" stroke="#749b86"/><text x="80" y="366" font-size="18">src/ + tests/</text><text x="445" y="366" class="small">公开演示实现及方法定义反例检查</text><path d="M45 405H70" stroke="#749b86"/><text x="80" y="412" font-size="18">outputs/demo/</text><text x="445" y="412" class="small">合成演示结果；不用于支持论文结论</text><path d="M45 451H70" stroke="#749b86"/><text x="80" y="458" font-size="18">archive/methods/</text><text x="445" y="458" class="small">历史函数摘录与来源哈希，展示实际项目方法积累</text><path d="M45 497H70" stroke="#749b86"/><text x="80" y="504" font-size="18">tools/ + provenance/</text><text x="445" y="504" class="small">数据目录生成、发布审计和精简来源信息</text></svg>