<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 505" role="img" aria-label="真实材料与合成演示的关系"><title>真实材料与合成演示的关系</title><rect width="1100" height="505" fill="#f5f7ef"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183f42}.small{font-size:15px;fill:#5c7468}.head{font-size:21px;font-weight:bold}</style><text x="35" y="45" class="head">数据公开边界与可复现范围</text><rect x="35" y="90" width="490" height="165" rx="15" fill="white" stroke="#c7d9c7"/><text x="55" y="125" class="head">真实研究材料</text><text x="55" y="162" font-size="18">自行整合的性状／来源／审阅</text><text x="55" y="195" class="small">保留原始证据归属与缺失</text><text x="55" y="227" class="small">data/traits/</text><rect x="575" y="90" width="490" height="165" rx="15" fill="white" stroke="#c7d9c7"/><text x="595" y="125" class="head">真实研究汇总</text><text x="595" y="162" font-size="18">自主审阅稿及聚合统计</text><text x="595" y="195" class="small">不附原始观测、坐标、距离明细</text><text x="595" y="227" class="small">docs/ + data/historical/</text><rect x="35" y="300" width="490" height="165" rx="15" fill="white" stroke="#c7d9c7"/><text x="55" y="335" class="head">合成运行输入</text><text x="55" y="372" font-size="18">从零生成虚构密度与生物量</text><text x="55" y="405" class="small">不读取、拟合或恢复真实样本</text><text x="55" y="437" class="small">data/synthetic/</text><rect x="575" y="300" width="490" height="165" rx="15" fill="white" stroke="#c7d9c7"/><text x="595" y="335" class="head">可运行演示输出</text><text x="595" y="372" font-size="18">规则合并、多维距离、季节检验</text><text x="595" y="405" class="small">证明流程可运行，不证明论文数值</text><text x="595" y="437" class="small">outputs/demo/</text></svg>